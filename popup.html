<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div id="container">
        <div class="header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <h1>Don't Phish Me </h1>
        </div>

        <div id="loading-state" class="state-view">
            <div class="spinner"></div>
            <p>Checking the waters..</p>
        </div>

        <div id="no-data-state" class="state-view hidden">
            <p>Website is in a hidden state.. </p>
            <p>Why not try reloading?</p>
        </div>

        <div id="result-state" class="state-view hidden">
            <div class="score-card">
                <div class="score-circle" id="score-circle">
                    <span id="score-value">--</span>%
                </div>
                <div class="score-label">Phishing (Oltalama)<br>Risk Skoru</div>
            </div>

            <div class="status-badge" id="status-badge">Durum</div>

            <div class="details-section" id="details-section">
                <h3>Analiz Detayları</h3>
                <ul id="reasons-list"></ul>
            </div>

            <div id="safe-indicator" class="hidden">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <p>Bu site güvenli ve testleri geçti.</p>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
